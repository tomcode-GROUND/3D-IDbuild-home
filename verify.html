<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D IDbuild home · GLB viewer</title>
  </head>
  <body style="margin: 0; background: #ded6c8; font: 14px system-ui">
    <header
      style="
        position: fixed;
        z-index: 2;
        top: 16px;
        left: 16px;
        background: #fffaeddd;
        padding: 14px;
        border-radius: 8px;
      "
    >
      <strong>Independent GLB check</strong>
      <p id="status">
        Choose an exported GLB. This viewer loads only its saved meshes and
        materials.
      </p>
      <input id="file" type="file" accept=".glb" />
    </header>
    <script type="module" src="/src/verify.ts"></script>
  </body>
</html>
